<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Lead Extractor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-6 rounded shadow-md w-full max-w-xl">
    <h1 class="text-2xl font-bold mb-4">Email Lead Extractor</h1>

    <!-- URL input section -->
    <div class="mb-6">
      <textarea id="urls" class="w-full border p-2 rounded" rows="4" placeholder="Enter URLs separated by commas..."></textarea>
    </div>

    <!-- File upload section -->
    <div class="mb-6">
      <input type="file" id="fileUpload" class="block w-full border p-2 rounded" />
    </div>

    <!-- Button to trigger either process -->
    <button onclick="startProcessing()" class="bg-blue-600 text-white px-4 py-2 rounded mt-4 hover:bg-blue-700">Start Processing</button>

    <div id="loader" class="mt-4 hidden">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8 mx-auto animate-spin"></div>
      <p class="text-center text-sm mt-2">Processing...</p>
    </div>

    <div id="result" class="mt-4 hidden">
      <button
        id="copyButton"
        type="button"
        onclick="copyResult()"
        class="w-full bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
      >
        Copy results
      </button>
      <textarea
        id="resultText"
        readonly
        onclick="copyResult()"
        class="mt-3 h-64 w-full resize-y rounded border p-3 font-mono text-sm"
        aria-label="Extracted results"
      ></textarea>
      <p id="copyStatus" class="mt-2 text-center text-sm text-gray-600"></p>
    </div>
  </div>

  <script>
    let latestResult = '';

    async function startProcessing() {
      const loader = document.getElementById('loader');
      const resultPanel = document.getElementById('result');
      const resultText = document.getElementById('resultText');
      const copyStatus = document.getElementById('copyStatus');
      const urls = document.getElementById('urls').value
        .split(',')
        .map((url) => url.trim())
        .filter(Boolean);
      const file = document.getElementById('fileUpload').files[0];

      loader.classList.remove('hidden');
      resultPanel.classList.add('hidden');
      copyStatus.textContent = '';

      let response;

      try {
        if (urls.length > 0) {
          // Process URLs
          response = await fetch('/api/scrape', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ urls })
          });
        } else if (file) {
          // Process file upload
          const formData = new FormData();
          formData.append('file', file);
          response = await fetch('/api/extract-emails', {
            method: 'POST',
            body: formData
          });
        } else {
          alert('Please provide either URLs or a file to process.');
          loader.classList.add('hidden');
          return;
        }

      const data = await response.json();
      loader.classList.add('hidden');

      if (response.ok && data.success) {
        latestResult = data.text || '';
        resultText.value = latestResult;
        resultPanel.classList.remove('hidden');

        if (latestResult.trim() === '') {
          copyStatus.textContent = 'No results found.';
        } else {
          await copyResult();
        }
      } else {
        alert(data.message || 'Processing failed. Please try again.');
      }
      } catch (error) {
        loader.classList.add('hidden');
        alert('Processing failed. Please try again.');
      }
    }

    async function copyResult() {
      const resultText = document.getElementById('resultText');
      const copyStatus = document.getElementById('copyStatus');

      if (!latestResult) return;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(latestResult);
        } else {
          resultText.focus();
          resultText.select();
          document.execCommand('copy');
        }

        copyStatus.textContent = 'Copied to clipboard.';
      } catch (error) {
        resultText.focus();
        resultText.select();
        copyStatus.textContent = 'Select all and copy from the box above.';
      }
    }
  </script>
</body>
</html>
